<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c2b2c">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Little Ganesha Tarot — The Golden Path by Benedict Interactive">
  <meta name="application-version" content="0.2.1">
  <title>Little Ganesha Tarot — The Golden Path</title>

  <link rel="preload" as="image" href="assets/ui/title-hero.png" fetchpriority="high">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+Thai:wght@300;400;500&family=Noto+Serif+Thai:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=0.2.1">
</head>
<body data-build="0.2.1">
  <main class="app-shell" id="app">
    <section class="studio-splash" id="studioSplash" aria-label="Benedict Interactive">
      <div class="studio-splash__glow" aria-hidden="true"></div>
      <div class="studio-wordmark">
        <span class="studio-wordmark__ornament" aria-hidden="true"></span>
        <p class="studio-wordmark__name">BENEDICT INTERACTIVE</p>
        <p class="studio-wordmark__caption">PRESENTS</p>
      </div>
    </section>

    <section class="title-screen" id="titleScreen" aria-labelledby="gameTitle" hidden>
      <div class="title-screen__backdrop" aria-hidden="true"></div>

      <div class="title-screen__stage">
        <img
          class="title-screen__art"
          src="assets/ui/title-hero.png"
          alt=""
          width="864"
          height="1536"
          decoding="async"
          fetchpriority="high"
        >

        <div class="title-screen__living" aria-hidden="true">
          <div class="title-screen__sky-light"></div>
          <div class="title-screen__water-shimmer"></div>
          <div class="ambient-motes" id="ambientMotes"></div>
          <div class="ambient-petals" id="ambientPetals"></div>
          <span class="lamp-glow lamp-glow--left"></span>
          <span class="lamp-glow lamp-glow--right"></span>
          <span class="lamp-glow lamp-glow--far"></span>
        </div>

        <div class="title-screen__veil" aria-hidden="true"></div>
        <div class="title-screen__shimmer" aria-hidden="true"></div>

        <header class="title-lockup">
          <span class="title-lockup__lotus" aria-hidden="true">✦</span>
          <h1 id="gameTitle">
            <span>LITTLE GANESHA</span>
            <span class="title-lockup__tarot">TAROT</span>
          </h1>
          <p class="title-lockup__subtitle">THE GOLDEN PATH</p>
        </header>

        <div class="title-actions">
          <button class="begin-button" id="beginButton" type="button">
            <span data-copy="begin">TAP TO BEGIN</span>
          </button>
        </div>

        <aside class="mini-player" id="miniPlayer" aria-label="Music player" hidden>
          <div class="mini-player__main">
            <div class="mini-player__meta">
              <span class="mini-player__eyebrow" id="playerEyebrow">NOW PLAYING</span>
              <strong class="mini-player__title" id="playerTitle">Golden Lantern at Twilight</strong>
            </div>
            <div class="mini-player__controls">
              <button class="player-button" id="playerPrevious" type="button" aria-label="Previous track">‹</button>
              <button class="player-button player-button--primary" id="playerPlay" type="button" aria-label="Pause" data-state="pause">
                <span class="player-icon player-icon--play" aria-hidden="true">▶</span>
                <span class="player-icon player-icon--pause" aria-hidden="true">Ⅱ</span>
              </button>
              <button class="player-button" id="playerNext" type="button" aria-label="Next track">›</button>
              <button class="player-button player-button--more" id="playerMore" type="button" aria-label="Audio options" aria-expanded="false">•••</button>
            </div>
          </div>

          <div class="mini-player__panel" id="playerPanel" hidden>
            <label class="volume-control">
              <span data-copy="volume">Volume</span>
              <input id="volumeSlider" type="range" min="0" max="100" step="1" value="58">
            </label>
            <div class="mini-player__panel-actions">
              <button class="panel-button" id="shuffleToggle" type="button" aria-pressed="true">
                <span aria-hidden="true">⤨</span>
                <span data-copy="shuffle">Shuffle</span>
              </button>
              <button class="panel-button panel-button--exit" id="exitButton" type="button">
                <span aria-hidden="true">↶</span>
                <span data-copy="exit">Return to Title</span>
              </button>
            </div>
          </div>
        </aside>

        <div class="title-utilities">
          <div class="language-switch" id="languageSwitch" role="group" aria-label="Language">
            <button class="language-switch__option is-active" type="button" data-language="en" aria-pressed="true">EN</button>
            <span class="language-switch__divider" aria-hidden="true"></span>
            <button class="language-switch__option" type="button" data-language="th" aria-pressed="false">ไทย</button>
          </div>

          <button class="sound-toggle" id="soundToggle" type="button" aria-pressed="true" aria-label="Sound on">
            <span class="sound-toggle__note" aria-hidden="true">♪</span>
            <span class="sound-toggle__slash" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </section>

    <div class="modal-backdrop" id="exitModal" role="dialog" aria-modal="true" aria-labelledby="exitModalTitle" hidden>
      <div class="modal-card">
        <span class="modal-card__ornament" aria-hidden="true">✦</span>
        <h2 id="exitModalTitle" data-copy="exitTitle">Return to Title?</h2>
        <p data-copy="exitBody">Your language and audio preferences will be kept.</p>
        <div class="modal-card__actions">
          <button class="modal-button" id="exitCancel" type="button" data-copy="cancel">Cancel</button>
          <button class="modal-button modal-button--primary" id="exitConfirm" type="button" data-copy="confirm">Return</button>
        </div>
      </div>
    </div>

    <p class="sr-only" id="liveStatus" aria-live="polite"></p>
  </main>

  <script src="js/audio.js?v=0.2.1" defer></script>
  <script src="js/app.js?v=0.2.1" defer></script>
</body>
</html>
